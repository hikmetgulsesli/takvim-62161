<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-dim": "#0b1326",
                    "surface-container-low": "#131b2e",
                    "on-error": "#690005",
                    "on-tertiary-fixed": "#261900",
                    "on-surface": "#dae2fd",
                    "secondary": "#b9c8de",
                    "on-background": "#dae2fd",
                    "primary-fixed": "#d4e3ff",
                    "surface-bright": "#31394d",
                    "on-primary-fixed": "#001c39",
                    "outline-variant": "#414751",
                    "tertiary-container": "#d19900",
                    "outline": "#8b919d",
                    "background": "#0b1326",
                    "tertiary-fixed": "#ffdea4",
                    "on-secondary": "#233143",
                    "primary": "#a4c9ff",
                    "on-surface-variant": "#c1c7d3",
                    "on-error-container": "#ffdad6",
                    "error": "#ffb4ab",
                    "primary-container": "#60a5fa",
                    "surface": "#0b1326",
                    "on-primary-container": "#003a6b",
                    "inverse-on-surface": "#283044",
                    "tertiary-fixed-dim": "#fabd34",
                    "surface-tint": "#a4c9ff",
                    "inverse-surface": "#dae2fd",
                    "tertiary": "#fabd34",
                    "secondary-container": "#39485a",
                    "on-primary-fixed-variant": "#004883",
                    "secondary-fixed-dim": "#b9c8de",
                    "primary-fixed-dim": "#a4c9ff",
                    "on-secondary-container": "#a7b6cc",
                    "surface-container-highest": "#2d3449",
                    "error-container": "#93000a",
                    "surface-variant": "#2d3449",
                    "inverse-primary": "#0060ac",
                    "on-tertiary-container": "#4b3500",
                    "on-secondary-fixed": "#0d1c2d",
                    "surface-container-lowest": "#060e20",
                    "on-tertiary": "#412d00",
                    "on-secondary-fixed-variant": "#39485a",
                    "on-tertiary-fixed-variant": "#5d4200",
                    "on-primary": "#00315d",
                    "surface-container-high": "#222a3d",
                    "secondary-fixed": "#d4e4fa",
                    "surface-container": "#171f33"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .glass-modal {
            background: rgba(45, 52, 73, 0.7);
            backdrop-filter: blur(12px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen overflow-hidden">
<!-- Ana Takvim Arka Planı (Simüle Edilmiş) -->
<div class="fixed inset-0 grid grid-cols-7 grid-rows-5 gap-0 opacity-20 pointer-events-none">
<div class="bg-surface-container border-outline-variant/10 p-4">12</div>
<div class="bg-surface-container border-outline-variant/10 p-4">13</div>
<div class="bg-surface-container-high border-outline-variant/10 p-4">14</div>
<div class="bg-surface-container border-outline-variant/10 p-4">15</div>
<div class="bg-surface-container border-outline-variant/10 p-4">16</div>
<div class="bg-surface-container border-outline-variant/10 p-4">17</div>
<div class="bg-surface-container border-outline-variant/10 p-4">18</div>
<!-- Tekrar eden kutular arka plan dokusu için -->
<div class="bg-surface-container border-outline-variant/10 p-4" v-for="i in 28"></div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-surface-dim/80 backdrop-blur-md px-4">
<!-- Gün Detay Modalı -->
<div class="glass-modal w-full max-w-lg rounded-xl shadow-2xl overflow-hidden flex flex-col relative border border-outline-variant/20">
<!-- Modal Header -->
<div class="p-6 flex justify-between items-start">
<div class="space-y-1">
<span class="text-xs font-bold tracking-widest text-on-secondary-container uppercase">Salı</span>
<h2 class="text-3xl font-bold tracking-tighter text-primary">14 Nisan 2026</h2>
</div>
<button class="p-2 text-on-surface-variant hover:text-error transition-colors duration-200" title="Sil">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
<!-- Modal Content -->
<div class="px-6 pb-6 space-y-6">
<div class="space-y-2">
<label class="text-[10px] font-black uppercase tracking-widest text-on-surface-variant">Notlar ve Hatırlatıcılar</label>
<div class="relative group">
<textarea class="w-full h-40 bg-surface-container-low/50 text-on-surface border-0 border-b border-outline-variant/20 focus:border-primary focus:ring-0 focus:bg-surface-container transition-all duration-300 resize-none p-4 rounded-lg placeholder:text-on-surface-variant/40" placeholder="Bir şeyler ekleyin...">Proje toplantısı hazırlıkları yapılacak</textarea>
</div>
</div>
<!-- Event Details (Minimalist Editorial Layout) -->
<div class="grid grid-cols-2 gap-4">
<div class="p-4 bg-surface-container-low rounded-lg flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="schedule">schedule</span>
<div>
<p class="text-[10px] uppercase tracking-widest text-on-secondary-container">Zaman</p>
<p class="text-sm font-semibold">Tüm Gün</p>
</div>
</div>
<div class="p-4 bg-surface-container-low rounded-lg flex items-center gap-3">
<span class="material-symbols-outlined text-tertiary" data-icon="priority_high">priority_high</span>
<div>
<p class="text-[10px] uppercase tracking-widest text-on-secondary-container">Öncelik</p>
<p class="text-sm font-semibold">Yüksek</p>
</div>
</div>
</div>
</div>
<!-- Modal Footer -->
<div class="p-6 pt-2 flex items-center justify-end gap-3">
<button class="px-6 py-2.5 text-sm font-bold text-primary hover:bg-primary/10 rounded-xl transition-all duration-200">
                    Vazgeç
                </button>
<button class="px-8 py-2.5 text-sm font-bold text-on-primary-container bg-gradient-to-br from-primary-container to-primary rounded-xl shadow-lg hover:shadow-primary/20 transition-all duration-200">
                    Kaydet
                </button>
</div>
<!-- Ambient Light Source (Visual Decoration) -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/10 blur-[60px] rounded-full pointer-events-none"></div>
<div class="absolute -bottom-24 -left-24 w-48 h-48 bg-tertiary/5 blur-[60px] rounded-full pointer-events-none"></div>
</div>
</div>
<!-- Background Illustration / Decorative Elements -->
<div class="fixed bottom-0 right-0 p-12 opacity-10 pointer-events-none select-none">
<h1 class="text-[12rem] font-black tracking-tighter leading-none text-outline-variant">2026</h1>
</div>
</body></html>
